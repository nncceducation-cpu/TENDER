name: Deploy to GitHub Pages

# Builds the application and publishes it to GitHub Pages on every push to main.
#
# The model assets are not committed, so the workflow stages them with
# fetch:models before building. That script verifies the face landmarker against
# a pinned SHA-256, so a silently changed upstream model fails the build rather
# than reaching a deployed page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Stage on-device model assets
        run: npm run fetch:models

      - name: Build
        env:
          TENDER_BASE: /${{ github.event.repository.name }}/
          TENDER_PUBLIC_DEMO: 'true'
        run: npx vite build

      - name: Serve index.html for unknown routes
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
